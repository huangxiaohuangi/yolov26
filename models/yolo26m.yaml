# YOLO26m object detection model with P3/8 - P5/32 outputs (YOLOv5 风格配置文件)
# 与 yolov5m.yaml 的写法保持一致：depth_multiple / width_multiple 控制模型规模
# 额外新增两个 YOLO26 专有参数：
#   reg_max : DFL 分箱数，1 表示去掉 DFL，直接回归 ltrb（YOLO26 默认）
#   end2end : 是否构建 one2one 分支（NMS-free 端到端推理）
#
# 用法: python train.py --cfg yolo26m.yaml --data data/coco128.yaml --img 640

# Parameters
nc: 80 # number of classes
depth_multiple: 0.50 # model depth multiple
width_multiple: 1.00 # layer channel multiple
max_channels: 512 # max channels per layer
reg_max: 1 # DFL bins (1 -> no DFL, direct ltrb regression)
end2end: True # build the one2one head for NMS-free inference

# YOLO26 backbone
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 3, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 2, C3k2, [256, False, 0.25]], # 2
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 2, C3k2, [512, False, 0.25]], # 4
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 2, C3k2, [512, True]], # 6
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
    [-1, 2, C3k2, [1024, True]], # 8
    [-1, 1, SPPF, [1024, 5, 3, True]], # 9
    [-1, 2, C2PSA, [1024]], # 10
  ]

# YOLO26 head
head: [
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 11
    [[-1, 6], 1, Concat, [1]], # 12 cat backbone P4
    [-1, 2, C3k2, [512, True]], # 13

    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 14
    [[-1, 4], 1, Concat, [1]], # 15 cat backbone P3
    [-1, 2, C3k2, [256, True]], # 16 (P3/8-small)

    [-1, 1, Conv, [256, 3, 2]], # 17
    [[-1, 13], 1, Concat, [1]], # 18 cat head P4
    [-1, 2, C3k2, [512, True]], # 19 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]], # 20
    [[-1, 10], 1, Concat, [1]], # 21 cat head P5
    [-1, 1, C3k2, [1024, True, 0.5, True]], # 22 (P5/32-large, with PSABlock)

    [[16, 19, 22], 1, Detect, [nc]], # 23 Detect(P3, P4, P5)
  ]
